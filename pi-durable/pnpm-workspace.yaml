allowBuilds:
  '@google/genai': set this to true or false
  '@mongodb-js/zstd': false
  esbuild: set this to true or false
  node-liblzma: false
  protobufjs: set this to true or false
  workerd: set this to true or false
minimumReleaseAgeExclude:
  - '@cloudflare/workers-types@5.20261007.1'
patchedDependencies:
  '@earendil-works/pi-durable@1.4.0': patches/@earendil-works__pi-durable@1.4.0.patch
  '@stablemodels/durable-bash@0.2.0': patches/@stablemodels__durable-bash@0.2.0.patch
# Type-only peer: validated against the project's Workers v5 types and workerd.
peerDependencyRules:
  allowedVersions:
    '@stablemodels/durable-bash>@cloudflare/workers-types': '^5.0.0'
    # DurableFs is patched and tested against this just-bash release.
    '@stablemodels/durable-bash>just-bash': '3.6.0'
