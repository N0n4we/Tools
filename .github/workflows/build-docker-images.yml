name: Build Docker images

on:
  push:
    branches:
      - main
    paths:
      - .github/dockerfile/**

permissions:
  contents: read
  packages: write

jobs:
  changed-dockerfiles:
    runs-on: ubuntu-latest
    outputs:
      files: ${{ steps.changed.outputs.files }}
    steps:
      - name: Get Dockerfiles changed in this commit
        id: changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}?per_page=100" \
            | jq -sc '[.[] | .files[]? | select(.status != "removed") | .filename
              | select(test("^\\.github/dockerfile/[a-z0-9]+([._-][a-z0-9]+)*\\.dockerfile$"))
              | {file: ., image: (split("/")[-1] | sub("\\.dockerfile$"; ""))}]
              | unique_by(.file)')
          echo "files=$files" >> "$GITHUB_OUTPUT"
          echo "Changed Dockerfiles: $files"

  build-and-push:
    needs: changed-dockerfiles
    if: needs.changed-dockerfiles.outputs.files != '[]'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include: ${{ fromJSON(needs.changed-dockerfiles.outputs.files) }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Set image name
        env:
          IMAGE_NAME: ${{ matrix.image }}
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}/${IMAGE_NAME}" >> "$GITHUB_ENV"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .github/dockerfile
          file: ${{ matrix.file }}
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:sha-${{ github.sha }}
